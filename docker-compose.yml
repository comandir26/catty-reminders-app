version: '3.8'

services:
  app:
    build: .
    image: ghcr.io/comandir26/catty-app:latest
    container_name: catty-app
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      - DATABASE_URL=mysql://user:password@db:3306/cattydb
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=cattydb
      - DB_USER=user
      - DB_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - catty-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: catty-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cattydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - catty-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:

networks:
  catty-network:
    driver: bridge