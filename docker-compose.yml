version: '3.8'

services:
  app:
    image: ghcr.io/comandir26/catty-app:latest
    container_name: catty-app
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      - DATABASE_URL=mysql://user:password@db:3306/cattydb
      - DB_HOST=localhost
      - DB_PORT=3306
      - DB_NAME=cattydb
      - DB_USER=user
      - DB_PASSWORD=password
    extra_hosts:
     - "localhost:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - catty-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.0
    container_name: catty-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cattydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - catty-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  catty-network:
    driver: bridge