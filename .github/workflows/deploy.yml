name: Deployment

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy with Docker Compose
      run: |
        echo "Starting Docker Compose deployment..."
        
        ssh -p 2200 -o StrictHostKeyChecking=no vlad@course.prafdin.ru '
          set -e
          echo "Creating project directory..."
          mkdir -p /home/vlad/catty-compose
          cd /home/vlad/catty-compose
          echo "Directory created: $(pwd)"
        '
        
        echo "Copying docker-compose.yml..."
        scp -P 2200 -o StrictHostKeyChecking=no docker-compose.yml vlad@course.prafdin.ru:/home/vlad/catty-compose/
        
        if [ -d "db" ]; then
          echo "Copying db directory..."
          scp -P 2200 -o StrictHostKeyChecking=no -r db/ vlad@course.prafdin.ru:/home/vlad/catty-compose/
        fi
        
        ssh -p 2200 -o StrictHostKeyChecking=no vlad@course.prafdin.ru '
          set -e
          cd /home/vlad/catty-compose
          
          echo "Current directory: $(pwd)"
          echo "Files in directory:"
          ls -la
          
          echo "Logging in to GitHub Container Registry..."
          echo "${{ secrets.DOCKER_PAT }}" | docker login ghcr.io -u comandir26 --password-stdin
          
          echo "Stopping existing stack..."
          docker-compose down  true
          
          echo "Starting new stack with Docker Compose..."
          docker-compose up -d
          
          echo "Waiting for services to start..."
          sleep 30
          
          echo "Checking services status..."
          docker-compose ps
          
          echo "Checking application health..."
          curl -f http://localhost:8181 && echo "Application is healthy"  echo "Health check failed"
          
          echo "Docker Compose deployment completed!"
          echo "App is available at: https://app.volkovvs.course.prafdin.ru"
        '