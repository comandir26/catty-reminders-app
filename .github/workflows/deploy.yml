name: CD - Deploy via Docker Compose

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with Docker Compose
        run: |
          echo "Starting Docker Compose deployment..."
          
          ssh -p 2200 -o StrictHostKeyChecking=no vlad@course.prafdin.ru '
            mkdir -p /home/vlad/catty-compose
            cd /home/vlad/catty-compose
          '

          scp -P 2200 -o StrictHostKeyChecking=no docker-compose.yml vlad@course.prafdin.ru:/home/vlad/catty-compose/
          
          ssh -p 2200 -o StrictHostKeyChecking=no vlad@course.prafdin.ru '
            cd /home/vlad/catty-compose
            
            echo "=== Authentication ==="
            echo "${{ secrets.DOCKER_PAT }}" | docker login ghcr.io -u comandir26 --password-stdin
            
            echo "=== Stopping existing stack ==="
            docker compose down --remove-orphans || echo "No stack to stop"
            
            echo "=== Pulling Latest Images ==="
            docker compose pull --quiet
            
            echo "=== Starting Stack ==="
            docker compose up -d --remove-orphans
            
            echo "=== Waiting for Database ==="
            echo "Waiting for database to be ready..."
            for i in {1..30}; do
              if docker compose logs db | grep -q "ready for connections"; then
                echo "Database is ready!"
                break
              fi
              echo "Waiting for database... ($i/30)"
              sleep 2
            done
            
            echo "=== Waiting for Application ==="
            sleep 10
            
            echo "=== Checking Services ==="
            docker compose ps --all
            
            echo "=== Health Check ==="
            if curl -s -f http://localhost:8181/ > /dev/null 2>&1; then
              echo "Application is healthy"
            else
              echo "Application health check failed"
              echo "=== Application Logs ==="
              docker compose logs app --tail=20
              echo "=== Database Logs ==="  
              docker compose logs db --tail=10
              exit 1
            fi
            
            echo "Deployment completed successfully!"
            echo "App is available at: https://app.volkovvs.course.prafdin.ru"
          '